<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop &amp; Deploy — 静态项目目录</title>
    <meta name="description" content="浏览、搜索和分享已经部署的静态项目。">
    <meta property="og:title" content="Drop &amp; Deploy — 静态项目目录">
    <meta property="og:description" content="一个轻量、自托管的静态项目档案馆。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://site.dengshu.ovh/og.png">
    <meta property="og:image:width" content="1536">
    <meta property="og:image:height" content="1024">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <main class="page">
        <header class="topbar">
            <a class="brand" href="/" aria-label="Drop &amp; Deploy 首页">
                <span class="brand-mark" aria-hidden="true">D</span>
                <span>
                    <strong>Drop &amp; Deploy</strong>
                    <small>静态项目档案馆</small>
                </span>
            </a>
            <a id="admin-link" class="outline-btn" href="/admin/">管理项目</a>
        </header>

        <section class="hero" aria-labelledby="page-title">
            <div class="hero-copy">
                <p class="eyebrow"><span></span> SELF-HOSTED COLLECTION</p>
                <h1 id="page-title">把每一个想法，<br><em>清楚地展示出来。</em></h1>
                <p class="hero-note">这里收录已经发布的静态页面与小型项目。搜索、打开，或把链接分享给需要的人。</p>
            </div>
            <div class="hero-stats" aria-label="项目概览">
                <article>
                    <span>公开项目</span>
                    <strong id="stat-sites">—</strong>
                </article>
                <article>
                    <span>累计访问</span>
                    <strong id="stat-views">—</strong>
                </article>
                <article>
                    <span>项目体积</span>
                    <strong id="stat-size">—</strong>
                </article>
            </div>
        </section>

        <section class="catalog" aria-labelledby="catalog-title">
            <div class="section-head">
                <div>
                    <p class="section-kicker">PROJECT INDEX</p>
                    <h2 id="catalog-title">项目目录</h2>
                    <p id="site-count">正在读取项目…</p>
                </div>
                <button id="refresh-btn" class="icon-btn" type="button" aria-label="刷新项目目录" title="刷新">↻</button>
            </div>

            <div class="catalog-tools">
                <label class="search-field">
                    <span class="search-icon" aria-hidden="true">⌕</span>
                    <span class="sr-only">搜索项目</span>
                    <input id="search-input" type="search" placeholder="搜索标题、简介或项目名" autocomplete="off">
                    <button id="clear-search" type="button" hidden>清除</button>
                </label>
                <label class="sort-field">
                    <span>排序</span>
                    <select id="sort-select">
                        <option value="updated">最近更新</option>
                        <option value="views">访问最多</option>
                        <option value="name">名称顺序</option>
                        <option value="size">体积最大</option>
                    </select>
                </label>
            </div>

            <div id="site-list" class="site-grid" aria-live="polite"></div>
        </section>

        <footer>
            <span>Drop &amp; Deploy</span>
            <span>轻量、自托管、公开只读</span>
        </footer>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
